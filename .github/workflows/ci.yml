name: CI
on:
  pull_request:
    branches: [13th-assignment, main]
  push:
    branches: [13th-assignment, main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bms-loop-back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
